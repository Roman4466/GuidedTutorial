# SwiftLint configuration for GuidedTutorial

included:
  - Sources

excluded:
  - Example
  - Tests
  - .build
  - build

disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

force_cast: warning
force_try: warning

nesting:
  type_level: 2
  function_level: 3

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 70
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

reporter: "xcode"
